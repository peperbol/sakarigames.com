<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aap Model</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f0f0f0;
    }

    /* Floating 3D model in bottom-left corner */
    #aap {
      position: fixed;
      left: 20px;
      bottom: 20px;

      width: 250px;
      height: 250px;

      z-index: 9999;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <model-viewer
    id="aap"
    src="aap.glb"
    alt="Aap"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
